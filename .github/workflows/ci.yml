name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip 'setuptools>=83' wheel
      - run: python -m pip install -e '.[dev]'
      - run: ruff check src tests
      - run: mypy src/slm_mcp_hub
      - run: pytest --cov=slm_mcp_hub
      - run: pip-audit --skip-editable --cache-dir /tmp/pip-audit-cache

  packages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
      - run: python -m pip install --upgrade pip 'setuptools>=83' wheel build
      - run: python -m build
      - run: npm test
      - run: npm pack --dry-run --json > npm-pack.json
      - name: Assert npm package contents
        run: |
          python - <<'PY'
          import json
          forbidden = ("__pycache__", ".pyc", ".egg-info", ".bak-", ".tgz")
          files = [item["path"] for item in json.load(open("npm-pack.json"))[0]["files"]]
          bad = [path for path in files if any(part in path for part in forbidden)]
          if bad:
              raise SystemExit(f"Forbidden npm package paths: {bad}")
          PY
      - name: Verify wheel in a clean environment
        run: |
          python -m venv /tmp/slm-wheel-check
          /tmp/slm-wheel-check/bin/pip install dist/*.whl
          test "$(/tmp/slm-wheel-check/bin/slm-hub --version | awk '{print $NF}')" = "0.2.6"
      - name: Verify npm shim against the built wheel
        run: |
          npm pack
          SLM_HUB_PYTHON_REQUIREMENT="$(pwd)/$(find dist -name '*.whl' -print -quit)" npm install -g ./slm-mcp-hub-0.2.6.tgz
          test "$(slm-hub --version | awk '{print $NF}')" = "0.2.6"

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
