[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "slm-mcp-hub"
dynamic = ["version"]
description = "A local-first MCP gateway for federating stdio and HTTP servers through one endpoint."
readme = "README.md"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.11"
authors = [
    {name = "Varun Pratap Bhardwaj", email = "varun.pratap.bhardwaj@gmail.com"},
]
keywords = ["mcp", "model-context-protocol", "gateway", "proxy", "ai-tools", "slm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "click>=8.1.0",
    "fastapi>=0.110.0",
    "httpx>=0.27.0",
    "uvicorn>=0.27.0",
]

[project.optional-dependencies]
network = ["zeroconf>=0.131.0"]
slm = ["superlocalmemory>=3.4.0"]
mesh = ["superlocalmemory>=3.4.0"]
full = ["superlocalmemory>=3.4.0"]
dev = [
    "build>=1.2",
    "httpx2>=2.9,<3",
    "pip-audit>=2.9",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.12",
]

[project.scripts]
slm-hub = "slm_mcp_hub.cli.main:main"

[project.urls]
Homepage = "https://github.com/qualixar/slm-mcp-hub"
Repository = "https://github.com/qualixar/slm-mcp-hub"
Documentation = "https://github.com/qualixar/slm-mcp-hub/tree/main/docs"

[project.entry-points."slm_mcp_hub.plugins"]
slm = "slm_mcp_hub.plugins.slm_plugin:SLMPlugin"
mesh = "slm_mcp_hub.plugins.mesh_plugin:MeshPlugin"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "slm_mcp_hub.core.constants.VERSION"}

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["slm_mcp_hub"]
omit = ["*/tests/*"]

[tool.coverage.report]
show_missing = true
fail_under = 96

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]
ignore = ["B027"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = []
